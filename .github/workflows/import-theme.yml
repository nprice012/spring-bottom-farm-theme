name: Import Shopify Theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, 'Expand Shopify theme') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand Shopify theme export
        shell: bash
        run: |
          set -euo pipefail
          zip_file=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          test -n "$zip_file"
          mkdir -p .theme_extract
          unzip -q "$zip_file" -d .theme_extract
          theme_root=$(find .theme_extract -type f -path '*/layout/theme.liquid' -print -quit | sed 's#/layout/theme.liquid$##')
          test -n "$theme_root"
          find "$theme_root" -mindepth 1 -maxdepth 1 -exec cp -R {} . \;
          rm -rf .theme_extract
          rm -f "$zip_file"

      - name: Link hero to Egg Subscription landing page
        shell: bash
        run: |
          set -euo pipefail
          path='sections/sbf-hero.liquid'
          test -f "$path"
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('sections/sbf-hero.liquid')
          text = path.read_text()
          if '/pages/egg-subscription' in text:
              print('Hero already points to Egg Subscription landing page.')
              raise SystemExit(0)
          candidates = []
          for match in re.finditer(r'<a\b[^>]*href=["\'][^"\']*["\'][^>]*>.*?</a>', text, re.I | re.S):
              block = match.group(0)
              visible = re.sub(r'<[^>]+>', ' ', block).lower()
              if 'egg subscription' in visible:
                  candidates.append(match)
          if len(candidates) != 1:
              raise SystemExit(f'Could not uniquely locate hero Egg Subscription button (matches={len(candidates)})')
          match = candidates[0]
          block = match.group(0)
          new_block = re.sub(r'(href=["\'])[^"\']*(["\'])', r'\g<1>/pages/egg-subscription\g<2>', block, count=1, flags=re.I)
          path.write_text(text[:match.start()] + new_block + text[match.end():])
          print('Hero linked to /pages/egg-subscription')
          PY

      - name: Commit imported theme
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expand Shopify theme and link Egg Subscription hero' || exit 0
          git push
